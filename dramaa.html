/* ============================================================
   3. STATE & UTIL
   ============================================================ */
let currentScript = [];
const container = document.getElementById('script-container');
const statusEl = document.getElementById('status');

function setStatus(msg, isError) {
    statusEl.textContent = msg;
    statusEl.style.color = isError ? '#dc3545' : '#888';
}

function escapeHtml(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;')
              .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

/* ============================================================
   4. RENDER
   ============================================================ */
function renderScript() {
    container.innerHTML = '';
    currentScript.forEach((item, index) => {
        const sceneMatch = item.dialogue.match(/Act\s+\d+/i);
        if (item.name.toLowerCase() === 'narrator' && sceneMatch) {
            const divider = document.createElement('div');
            divider.className = 'scene-divider';
            divider.innerHTML = `<span>${sceneMatch[0]}</span>`;
            container.appendChild(divider);
        }

        const row = document.createElement('div');
        row.className = 'script-row';
        row.innerHTML = `
            <button class="btn-play" data-index="${index}">▶ Play</button>
            <div class="character-name">${escapeHtml(item.name)}:</div>
            <div class="dialogue-text" id="text-${index}">${escapeHtml(item.dialogue)}</div>
            <div class="edit-actions">
                <button class="btn-edit" data-index="${index}">✏️ Edit</button>
                <button class="btn-save" data-index="${index}" style="display:none;">💾 Simpan</button>
                <button class="btn-cancel" data-index="${index}" style="display:none;">✖ Batal</button>
            </div>
        `;
        container.appendChild(row);
    });
    attachEventListeners();
}

/* ============================================================
   5. EVENT LISTENERS (Play / Edit / Save / Cancel)
   ============================================================ */
function attachEventListeners() {
    // Play
    container.querySelectorAll('.btn-play').forEach(btn => {
        btn.addEventListener('click', () => {
            const idx = parseInt(btn.dataset.index);
            playVoice(currentScript[idx].dialogue, currentScript[idx].gender);
        });
    });

    // Edit
    container.querySelectorAll('.btn-edit').forEach(btn => {
        btn.addEventListener('click', () => toggleEdit(parseInt(btn.dataset.index), true));
    });

    // Cancel
    container.querySelectorAll('.btn-cancel').forEach(btn => {
        btn.addEventListener('click', () => {
            const idx = parseInt(btn.dataset.index);
            const textEl = document.getElementById(`text-${idx}`);
            textEl.textContent = currentScript[idx].dialogue; // revert
            toggleEdit(idx, false);
        });
    });

    // Save
    container.querySelectorAll('.btn-save').forEach(btn => {
        btn.addEventListener('click', () => {
            const idx = parseInt(btn.dataset.index);
            saveEdit(idx);
        });
    });
}

function toggleEdit(index, editing) {
    const textEl = document.getElementById(`text-${index}`);
    const row = textEl.closest('.script-row');
    const editBtn = row.querySelector('.btn-edit');
    const saveBtn = row.querySelector('.btn-save');
    const cancelBtn = row.querySelector('.btn-cancel');

    if (editing) {
        textEl.setAttribute('contenteditable', 'true');
        textEl.focus();
        editBtn.style.display = 'none';
        saveBtn.style.display = 'inline-block';
        cancelBtn.style.display = 'inline-block';
    } else {
        textEl.removeAttribute('contenteditable');
        editBtn.style.display = 'inline-block';
        saveBtn.style.display = 'none';
        cancelBtn.style.display = 'none';
    }
}

/* ============================================================
   6. SIMPAN KE FIRESTORE
   ============================================================ */
async function saveEdit(index) {
    const textEl = document.getElementById(`text-${index}`);
    const newText = textEl.textContent.trim();

    if (!newText) {
        setStatus('Dialog tidak boleh kosong.', true);
        return;
    }

    currentScript[index].dialogue = newText;
    toggleEdit(index, false);

    setStatus('Menyimpan ke server...');
    try {
        await setDoc(doc(db, COLLECTION, DOC_ID), { items: currentScript });
        setStatus('Tersimpan');
    } catch (err) {
        console.error(err);
        setStatus('❌ Gagal menyimpan: ' + err.message + ' (periksa Firestore rules)', true);
    }
}

/* ============================================================
   7. LOAD DARI FIRESTORE
   ============================================================ */
async function loadScript() {
    setStatus('Memuat data dari server...');
    try {
        const snap = await getDoc(doc(db, COLLECTION, DOC_ID));
        if (snap.exists() && Array.isArray(snap.data().items)) {
            currentScript = snap.data().items;
            setStatus('direfresh');
        } else {
            // Server kosong → upload default
            currentScript = JSON.parse(JSON.stringify(DEFAULT_SCRIPT));
            await setDoc(doc(db, COLLECTION, DOC_ID), { items: currentScript });
            setStatus('Server masih kosong. Naskah asli otomatis diunggah.');
        }
        renderScript();
    } catch (err) {
        console.error(err);
        setStatus('❌ Gagal memuat: ' + err.message + '. Menggunakan naskah asli sementara.', true);
        currentScript = JSON.parse(JSON.stringify(DEFAULT_SCRIPT));
        renderScript();
    }
}

/* ============================================================
   8. RESET KE DEFAULT
   ============================================================ */
async function resetToDefault() {
    if (!confirm('Yakin ingin mengembalikan semua dialog ke naskah asli? Perubahan Anda akan hilang.')) return;
    currentScript = JSON.parse(JSON.stringify(DEFAULT_SCRIPT));
    renderScript();
    setStatus('Menyimpan reset ke server...');
    try {
        await setDoc(doc(db, COLLECTION, DOC_ID), { items: currentScript });
        setStatus('✅ Naskah berhasil direset ke versi asli.');
    } catch (err) {
        console.error(err);
        setStatus('❌ Gagal reset: ' + err.message, true);
    }
}

/* ============================================================
   9. TEXT TO SPEECH
   ============================================================ */
function playVoice(text, gender) {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'en-US';
    const voices = window.speechSynthesis.getVoices();
    let selectedVoice = voices.find(v => v.lang.startsWith('en') && v.name.toLowerCase().includes(gender));
    if (!selectedVoice) selectedVoice = voices.find(v => v.lang.startsWith('en'));
    if (selectedVoice) utterance.voice = selectedVoice;
    window.speechSynthesis.speak(utterance);
}

/* ============================================================
   10. INIT
   ============================================================ */
window.speechSynthesis.getVoices();
loadScript();

// expose ke window (dipanggil dari onclick toolbar)
window.loadScript = loadScript;
window.resetToDefault = resetToDefault;
</script>
